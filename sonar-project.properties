sonar.projectKey=slargacha_-epm-task-python
sonar.projectName=-EPAM Task Python
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source code
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**

# Python analyzer
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

# Coverage settings
sonar.python.coverage.itReportPath=coverage.xml

# Exclusions
sonar.exclusions=tests/**/*.py,**/__pycache__/**,**/*.pyc

# Code Quality Gates
sonar.qualitygate.wait=true
